site_name: Autobus
site_description: Autonomous bus routing on a planar street graph

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest

markdown_extensions:
  # Renders the "!!! note" / "!!! warning" callouts used in the concept pages.
  - admonition

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]  # project root, so src.map.graph resolves
          options:
            show_root_heading: true

nav:
  - Home: index.md
  - Running: running.md
  - Concepts:
      - Map: concepts/map.md
      - Requests: concepts/requests.md
      - Demand Generation: concepts/demand_generation.md
      - Dispatch Policy: concepts/dispatch_policy.md
      - Window Insertion: concepts/window_insertion.md
      - Route Reordering: concepts/route_reordering.md
      - Travel Model: concepts/travel_model.md
      - Bus Agent: concepts/bus_agent.md
      - Metrics: concepts/metrics.md
      - Simulation Backend: concepts/simulation_backend.md
      - Simulation Runner: concepts/simulation_runner.md
      - Experiment Helpers: concepts/experiment.md
  - API Reference:
      - Map: api/map.md
      - Requests: api/requests.md
      - Simulation: api/simulation.md
      - Algorithm: api/algorithm.md
      - Metrics: api/metrics.md
      - Experiment: api/experiment.md
