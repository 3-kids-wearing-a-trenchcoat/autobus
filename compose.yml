name: carla-autobus

services:
  carla:
    image: carlasim/carla:0.9.16
    container_name: carla
    network_mode: host
    tty: true
    stdin_open: true
    user: "1000:1000"

    devices:
      - /dev/dri:/dev/dri

    group_add:
      - video

    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /tmp/.Xauthority
      SDL_VIDEODRIVER: dummy
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      # sanity check
      # LIBGL_ALWAYS_SOFTWARE: "1"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:rw # Map host auth to container

    # command: ["bash", "CarlaUE4.sh", "-nosound"]

    command: ["bash", "CarlaUE4.sh", "-nosound", "-RenderOffScreen"]
