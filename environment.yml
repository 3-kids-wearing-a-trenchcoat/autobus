name: carla-env

channels:
  - conda-forge

dependencies:
  # Python version (matches CARLA support)
  - python=3.12

  # Core scientific stack
  - numpy
  - scipy
  - pandas

  # Visualization
  - matplotlib
  - seaborn

  # Viewer window for watching a CARLA run. CARLA's own debug drawing is
  # world-space only -- there is no screen-space API in it at all -- so a
  # real 2D HUD needs a client-side window, which is how CARLA's bundled
  # manual_control.py does it too. Only imported by src/simulation/viewer.py.
  - pygame

  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets

  # Utilities
  - tqdm
  - rich
  - pytest=9.0.3

  # Graphs (useful for routing / road logic)
  - networkx

  # YAML config
  - pyyaml

  # Pip section for things not in conda
  - pip
  - pip:
      - carla==0.9.16
      - mkdocs==1.6.1
      - mkdocs-material==9.7.6
      - mkdocstrings==1.0.4
      - mkdocstrings-python==2.0.3
      - ipympl==0.10.0
